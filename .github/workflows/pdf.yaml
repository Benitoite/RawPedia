name: Build RawTherapee Manual PDF

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-manual:
    name: Build RawTherapee Manual
    runs-on: macos-latest

    steps:
      - name: Checkout manual builder repo
        uses: actions/checkout@v4

      - name: Checkout RawTherapee
        uses: actions/checkout@v4
        with:
          repository: Beep6581/RawTherapee
          ref: dev
          path: repo-rt

      - name: Checkout RawPedia
        uses: actions/checkout@v4
        with:
          repository: rawtherapee/rawpedia
          ref: master
          path: RawPedia

      - name: Install dependencies
        run: |
          set -euo pipefail

          brew install \
            hugo \
            imagemagick \
            qrencode \
            cairo \
            pango \
            gdk-pixbuf \
            libffi

          python3 -m venv "$GITHUB_WORKSPACE/.venv"
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pip install --upgrade pip
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pip install weasyprint

          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

          hugo version
          "$GITHUB_WORKSPACE/.venv/bin/weasyprint" --version

      - name: Build RawPedia Hugo site
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/RawPedia"

          rm -rf Public public

          hugo \
            --destination "$GITHUB_WORKSPACE/RawPedia/Public"

          echo "---- Hugo output root ----"
          ls -la "$GITHUB_WORKSPACE/RawPedia/Public"

          echo "---- First generated HTML files ----"
          find "$GITHUB_WORKSPACE/RawPedia/Public" -type f -name "*.html" | sort | head -50

          HTML_COUNT="$(find "$GITHUB_WORKSPACE/RawPedia/Public" -type f -name "*.html" | wc -l | tr -d ' ')"
          echo "HTML_COUNT=$HTML_COUNT"

          if [[ "$HTML_COUNT" -lt 2 ]]; then
            echo "❌ Hugo generated fewer than 2 HTML files. Manual would contain no article content."
            echo "---- RawPedia repo root ----"
            ls -la "$GITHUB_WORKSPACE/RawPedia"
            echo "---- RawPedia content dir ----"
            find "$GITHUB_WORKSPACE/RawPedia/content" -maxdepth 3 -type f | sort | head -80 || true
            exit 1
          fi

      - name: Prepare local paths expected by script
        run: |
          set -euo pipefail

          echo "HOME=$HOME"
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"

          rm -rf "$HOME/repo-rt"
          rm -rf "$HOME/RawPedia"

          ln -s "$GITHUB_WORKSPACE/repo-rt" "$HOME/repo-rt"
          ln -s "$GITHUB_WORKSPACE/RawPedia" "$HOME/RawPedia"

          test -d "$HOME/repo-rt"
          test -d "$HOME/RawPedia"
          test -d "$HOME/RawPedia/Public"
          test -d "$HOME/RawPedia/content"

          ls -la "$HOME"

      - name: Build RawPedia Hugo site
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/RawPedia"

          rm -rf Public public

          hugo \
            --gc \
            --minify \
            --printPathWarnings \
            --destination "$GITHUB_WORKSPACE/RawPedia/Public"

          echo "---- Hugo output root ----"
          ls -la "$GITHUB_WORKSPACE/RawPedia/Public"

          echo "---- First generated HTML files ----"
          find "$GITHUB_WORKSPACE/RawPedia/Public" -type f -name "*.html" | sort | head -80

          echo "---- HTML count ----"
          HTML_COUNT="$(find "$GITHUB_WORKSPACE/RawPedia/Public" -type f -name "*.html" | wc -l | tr -d ' ')"
          echo "HTML_COUNT=$HTML_COUNT"

          if [[ "$HTML_COUNT" -lt 2 ]]; then
            echo "❌ Hugo generated fewer than 2 HTML files."
            exit 1
          fi

      - name: Verify PDF content was generated
        run: |
          set -euo pipefail

          test -f rawpedia_book/book.html
          test -f rawtherapee_manual.pdf

          echo "---- Selected article count from log files ----"
          grep -n "article" rawpedia_book/book.html | head || true

          ARTICLE_COUNT="$(grep -c '<section class="article"' rawpedia_book/book.html || true)"
          echo "ARTICLE_COUNT=$ARTICLE_COUNT"

          if [[ "$ARTICLE_COUNT" -lt 1 ]]; then
            echo "❌ Manual HTML contains no article sections."
            echo "---- Generated reports ----"
            ls -la rawpedia_book || true
            echo "---- Suppressed redirects ----"
            cat rawpedia_book/suppressed-redirect-pages.txt 2>/dev/null | head -80 || true
            echo "---- Suppressed main pages ----"
            cat rawpedia_book/suppressed-main-pages.txt 2>/dev/null | head -80 || true
            exit 1
          fi

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: rawtherapee-manual-pdf
          path: rawtherapee_manual.pdf
          if-no-files-found: error

      - name: Upload build reports
        uses: actions/upload-artifact@v4
        with:
          name: rawpedia-book-reports
          path: |
            rawpedia_book/book.html
            rawpedia_book/*.txt
            rawpedia_book/*.svg
            rawpedia_book/*.png
          if-no-files-found: warn
