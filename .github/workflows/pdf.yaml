name: Build RawPedia PDF

on:
  workflow_dispatch:
    inputs:
      rawtherapee_repository:
        description: RawTherapee repository
        required: true
        default: Beep6581/RawTherapee
      rawtherapee_ref:
        description: RawTherapee ref
        required: true
        default: dev
      rawpedia_repository:
        description: RawPedia repository
        required: true
        default: rawtherapee/rawpedia
      rawpedia_ref:
        description: RawPedia ref
        required: true
        default: master
      script_path:
        description: Manual builder script path
        required: true
        default: scripts/build-pdf.zsh
      rawpedia_qr_jobs:
        description: QR generation jobs
        required: true
        default: "4"

  push:
    tags:
      - "*"

  pull_request:
    types:
      - closed
    branches:
      - master

permissions:
  contents: read

jobs:
  build-manual:
    name: Build RawTherapee Manual
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)

    runs-on: macos-latest

    steps:
      - name: Checkout manual builder repo
        uses: actions/checkout@v4

      - name: Checkout RawTherapee
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.rawtherapee_repository || 'Beep6581/RawTherapee' }}
          ref: ${{ inputs.rawtherapee_ref || 'dev' }}
          path: repo-rt
          fetch-depth: 0

      - name: Checkout RawPedia
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.rawpedia_repository || 'rawtherapee/rawpedia' }}
          ref: ${{ inputs.rawpedia_ref || 'master' }}
          path: RawPedia
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          set -euo pipefail

          brew update

          brew install \
            hugo \
            imagemagick \
            qrencode \
            qpdf \
            cairo \
            pango \
            gdk-pixbuf \
            libffi \
            node

          python3 -m venv "$GITHUB_WORKSPACE/.venv"
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pip install --upgrade pip setuptools wheel
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pip install weasyprint beautifulsoup4

          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

          echo "---- tool versions ----"
          python3 --version
          "$GITHUB_WORKSPACE/.venv/bin/python" --version
          hugo version
          qpdf --version
          qrencode --version || true
          magick -version | head -5 || true
          node --version
          npm --version
          "$GITHUB_WORKSPACE/.venv/bin/weasyprint" --version

      - name: Bootstrap RawPedia theme assets
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/RawPedia"

          echo "---- submodules ----"
          git submodule status --recursive || true

          if [[ -d themes/hugo-bootstrap-bare/assets ]]; then
            cd themes/hugo-bootstrap-bare/assets
            npm install
          else
            echo "❌ Expected theme asset directory missing:"
            echo "themes/hugo-bootstrap-bare/assets"
            find "$GITHUB_WORKSPACE/RawPedia/themes" -maxdepth 5 -type d | sort || true
            exit 1
          fi

      - name: Build RawPedia Hugo site
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/RawPedia"

          rm -rf Public public

          hugo \
            --gc \
            --minify \
            --printPathWarnings \
            --destination "$GITHUB_WORKSPACE/RawPedia/Public"

          echo "---- Hugo output root ----"
          ls -la "$GITHUB_WORKSPACE/RawPedia/Public"

          echo "---- HTML count ----"
          HTML_COUNT="$(find "$GITHUB_WORKSPACE/RawPedia/Public" -type f -name "*.html" | wc -l | tr -d ' ')"
          echo "HTML_COUNT=$HTML_COUNT"

          if [[ "$HTML_COUNT" -lt 2 ]]; then
            echo "❌ Hugo generated fewer than 2 HTML files."
            exit 1
          fi

      - name: Prepare local paths expected by script
        run: |
          set -euo pipefail

          rm -rf "$HOME/repo-rt" "$HOME/RawPedia" "$HOME/rawpedia"

          ln -s "$GITHUB_WORKSPACE/repo-rt" "$HOME/repo-rt"
          ln -s "$GITHUB_WORKSPACE/RawPedia" "$HOME/RawPedia"

          test -d "$HOME/repo-rt/.git"
          test -d "$HOME/RawPedia/.git"
          test -d "$HOME/RawPedia/Public"
          test -d "$HOME/RawPedia/content"
          test -f "$HOME/repo-rt/tools/osx/rawtherapee.icns"
          test -f "$HOME/repo-rt/rtdata/images/rawtherapee.ico"
          test -f "$HOME/repo-rt/AUTHORS.txt"

      - name: Build PDF manual
        env:
          RAWPEDIA_QR_JOBS: ${{ inputs.rawpedia_qr_jobs || '4' }}
          SOURCE_DIR: ${{ github.workspace }}/RawPedia/Public
          CONTENTS_DIR: ${{ github.workspace }}/RawPedia/content
          RT_GIT_DIR: ${{ github.workspace }}/repo-rt
          RAWPEDIA_GIT_DIR: ${{ github.workspace }}/RawPedia
          RT_COVER_ICNS: ${{ github.workspace }}/repo-rt/tools/osx/rawtherapee.icns
          RT_HEADER_ICO: ${{ github.workspace }}/repo-rt/rtdata/images/rawtherapee.ico
          RT_AUTHORS_TXT: ${{ github.workspace }}/repo-rt/AUTHORS.txt
          SCRIPT_PATH: ${{ inputs.script_path || 'scripts/build-pdf.zsh' }}
        run: |
          set -euo pipefail

          export PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH"

          echo "---- tool paths ----"
          which python3
          which python
          which hugo
          which weasyprint
          which qpdf
          which qrencode
          which magick || true

          echo "---- tool versions ----"
          python3 --version
          weasyprint --version
          qpdf --version
          hugo version

          echo "---- build env ----"
          echo "RAWPEDIA_QR_JOBS=$RAWPEDIA_QR_JOBS"
          echo "SOURCE_DIR=$SOURCE_DIR"
          echo "CONTENTS_DIR=$CONTENTS_DIR"
          echo "RT_GIT_DIR=$RT_GIT_DIR"
          echo "RAWPEDIA_GIT_DIR=$RAWPEDIA_GIT_DIR"
          echo "SCRIPT_PATH=$SCRIPT_PATH"

          chmod +x "$SCRIPT_PATH"

          mkdir -p rawtherapee-manual

          if ! "./$SCRIPT_PATH" 2>&1 | tee rawtherapee_manual/build-script.log; then
            echo "❌ Manual build failed."
            echo
            echo "---- build-script.log tail ----"
            tail -240 rawtherapee-manual/build-script.log || true
            echo
            echo "---- workspace root ----"
            ls -la || true
            echo
            echo "---- rawtherapee-manual directory ----"
            ls -la rawtherapee-manual || true
            exit 1
          fi

      - name: Verify PDF content was generated
        run: |
          set -euo pipefail
      
          BOOK_DIR="rawtherapee_manual"
      
          test -f "$BOOK_DIR/book.html"
          test -s rawtherapee_manual.pdf
      
          echo "---- Generated output files ----"
          ls -lh rawtherapee_manual.pdf
          ls -la "$BOOK_DIR" | head -160
      
          echo "---- PDF page count ----"
          PAGE_COUNT="$(qpdf --show-npages rawtherapee_manual.pdf)"
          echo "PAGE_COUNT=$PAGE_COUNT"
      
          if (( PAGE_COUNT < 20 )); then
            echo "❌ PDF page count is suspiciously low."
            exit 1
          fi
      
          if (( PAGE_COUNT % 4 != 0 )); then
            echo "❌ PDF page count is not divisible by 4."
            exit 1
          fi
      
          echo "---- Selected article count from generated HTML ----"
          ARTICLE_COUNT="$(
            python3 - "$BOOK_DIR/book.html" <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import sys
      
          class ArticleCounter(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.count = 0
      
              def handle_starttag(self, tag, attrs):
                  if tag.lower() != "section":
                      return
      
                  attrs = dict(attrs)
                  section_id = attrs.get("id", "")
                  classes = attrs.get("class", "").split()
      
                  if section_id.startswith("page-") and "article" in classes:
                      self.count += 1
      
          s = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
      
          parser = ArticleCounter()
          parser.feed(s)
      
          print(parser.count)
          PY
          )"
      
          echo "ARTICLE_COUNT=$ARTICLE_COUNT"
      
          if [[ "$ARTICLE_COUNT" -lt 1 ]]; then
            echo "❌ Manual HTML contains no article sections."
            exit 1
          fi

      - name: Upload PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rawtherapee-manual-pdf
          path: rawtherapee_manual.pdf
          if-no-files-found: warn
