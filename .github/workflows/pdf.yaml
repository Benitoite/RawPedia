name: Build RawTherapee Manual PDF

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-manual:
    name: Build RawTherapee Manual
    runs-on: macos-latest

    steps:
      - name: Checkout manual builder repo
        uses: actions/checkout@v4

      - name: Checkout RawTherapee
        uses: actions/checkout@v4
        with:
          repository: Beep6581/RawTherapee
          ref: dev
          path: repo-rt
          fetch-depth: 0

      - name: Checkout RawPedia
        uses: actions/checkout@v4
        with:
          repository: rawtherapee/rawpedia
          ref: master
          path: RawPedia
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          set -euo pipefail

          brew install \
            hugo \
            imagemagick \
            qrencode \
            cairo \
            pango \
            gdk-pixbuf \
            libffi \
            node

          python3 -m venv "$GITHUB_WORKSPACE/.venv"
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pip install --upgrade pip
          "$GITHUB_WORKSPACE/.venv/bin/python" -m pip install weasyprint

          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

          hugo version
          node --version
          npm --version
          "$GITHUB_WORKSPACE/.venv/bin/weasyprint" --version

      - name: Bootstrap RawPedia theme assets
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/RawPedia"

          git submodule status --recursive || true

          if [[ -d themes/hugo-bootstrap-bare/assets ]]; then
            cd themes/hugo-bootstrap-bare/assets
            npm install
          else
            echo "❌ Expected theme asset directory missing:"
            echo "themes/hugo-bootstrap-bare/assets"
            echo
            echo "---- themes directory ----"
            find "$GITHUB_WORKSPACE/RawPedia/themes" -maxdepth 4 -type d | sort || true
            exit 1
          fi

      - name: Build RawPedia Hugo site
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE/RawPedia"

          rm -rf Public public

          hugo \
            --gc \
            --minify \
            --printPathWarnings \
            --destination "$GITHUB_WORKSPACE/RawPedia/Public"

          echo "---- Hugo output root ----"
          ls -la "$GITHUB_WORKSPACE/RawPedia/Public"

          echo "---- First generated HTML files ----"
          find "$GITHUB_WORKSPACE/RawPedia/Public" -type f -name "*.html" | sort | head -80 || true

          echo "---- HTML count ----"
          HTML_COUNT="$(find "$GITHUB_WORKSPACE/RawPedia/Public" -type f -name "*.html" | wc -l | tr -d ' ')"
          echo "HTML_COUNT=$HTML_COUNT"

          if [[ "$HTML_COUNT" -lt 2 ]]; then
            echo "❌ Hugo generated fewer than 2 HTML files."
            exit 1
          fi

          echo "---- Sanity check generated page content ----"
          FIRST_ENGLISH_PAGE="$(
            find "$GITHUB_WORKSPACE/RawPedia/Public" -type f -name "index.html" \
              ! -path "*/fr/*" \
              ! -path "*/index.fr/*" \
              ! -path "*/index.es/*" \
              ! -path "*/index.it/*" \
              ! -path "*/index.jp/*" \
              ! -path "*/index.pt/*" \
              | sort \
              | head -1 || true
          )"

          echo "FIRST_ENGLISH_PAGE=$FIRST_ENGLISH_PAGE"

          if [[ -n "$FIRST_ENGLISH_PAGE" ]]; then
            wc -c "$FIRST_ENGLISH_PAGE"

            PLAIN_LEN="$(
              perl -0pe 's/<script\b.*?<\/script>/ /gis; s/<style\b.*?<\/style>/ /gis; s/<[^>]+>/ /g; s/\s+/ /g' "$FIRST_ENGLISH_PAGE" \
                | wc -c \
                | tr -d ' '
            )"

            echo "PLAIN_LEN=$PLAIN_LEN"
            echo "PLAIN_HEAD:"
            perl -0pe 's/<script\b.*?<\/script>/ /gis; s/<style\b.*?<\/style>/ /gis; s/<[^>]+>/ /g; s/\s+/ /g' "$FIRST_ENGLISH_PAGE" \
              | cut -c 1-500 || true
          fi

      - name: Prepare local paths expected by script
        run: |
          set -euo pipefail

          echo "HOME=$HOME"
          echo "GITHUB_WORKSPACE=$GITHUB_WORKSPACE"

          rm -rf "$HOME/repo-rt"
          rm -rf "$HOME/RawPedia"

          ln -s "$GITHUB_WORKSPACE/repo-rt" "$HOME/repo-rt"
          ln -s "$GITHUB_WORKSPACE/RawPedia" "$HOME/RawPedia"

          test -d "$HOME/repo-rt"
          test -d "$HOME/RawPedia"
          test -d "$HOME/RawPedia/Public"
          test -d "$HOME/RawPedia/content"

          ls -la "$HOME"

      - name: Build PDF manual
        env:
          SOURCE_DIR: ${{ github.workspace }}/RawPedia/Public
          CONTENTS_DIR: ${{ github.workspace }}/RawPedia/content
          RT_GIT_DIR: ${{ github.workspace }}/repo-rt
          RAWPEDIA_GIT_DIR: ${{ github.workspace }}/RawPedia
          RT_COVER_ICNS: ${{ github.workspace }}/repo-rt/tools/osx/rawtherapee.icns
          RT_HEADER_ICO: ${{ github.workspace }}/repo-rt/rtdata/images/rawtherapee.ico
          RT_AUTHORS_TXT: ${{ github.workspace }}/repo-rt/AUTHORS.txt
        run: |
          set -euo pipefail

          export PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH"

          which python
          which hugo
          which weasyprint
          weasyprint --version

          echo "SOURCE_DIR=$SOURCE_DIR"
          echo "CONTENTS_DIR=$CONTENTS_DIR"
          echo "RT_GIT_DIR=$RT_GIT_DIR"
          echo "RAWPEDIA_GIT_DIR=$RAWPEDIA_GIT_DIR"

          echo "---- HTML files passed to manual script ----"
          find "$SOURCE_DIR" -type f -name "*.html" | sort | head -80 || true

          chmod +x scripts/build-rawpedia-manual.zsh

          if ! ./scripts/build-rawpedia-manual.zsh; then
          echo "❌ Manual build failed."
          echo
          echo "---- rawpedia_book directory ----"
          ls -la rawpedia_book || true
          echo
          echo "---- pages-all.txt ----"
          head -120 rawpedia_book/pages-all.txt 2>/dev/null || true
          echo
          echo "---- selected-pages.txt ----"
          cat rawpedia_book/selected-pages.txt 2>/dev/null || true
          echo
          echo "---- skip-reasons first 220 lines ----"
          head -220 rawpedia_book/skip-reasons.txt 2>/dev/null || true
          echo
          echo "---- skip-reasons category summary ----"
          grep -n "^count:\|^not-\|^suppressed-\|^redirect" rawpedia_book/skip-reasons.txt 2>/dev/null || true
          echo
          echo "---- suppressed-redirect-pages.txt ----"
          cat rawpedia_book/suppressed-redirect-pages.txt 2>/dev/null || true
          echo
          echo "---- suppressed-main-pages.txt ----"
          cat rawpedia_book/suppressed-main-pages.txt 2>/dev/null || true
        
          echo
          echo "---- image refs in generated book.html ----"
          if [[ -f rawpedia_book/book.html ]]; then
            echo "img tags:"
            grep -c '<img\b' rawpedia_book/book.html || true
        
            echo "src file refs:"
            grep -Eo 'src=["'\'']file://[^"'\'']+' rawpedia_book/book.html | wc -l | tr -d ' ' || true
            echo
        
            echo "src http refs:"
            grep -Eo 'src=["'\'']https?://[^"'\'']+' rawpedia_book/book.html | wc -l | tr -d ' ' || true
            echo
        
            echo "missing-image boxes:"
            grep -c 'class=["'\'']missing-image["'\'']' rawpedia_book/book.html || true
        
            echo "sample unresolved image attrs:"
            grep -Eo '(src|data-src|data-original|data-lazy-src)=["'\''][^"'\'']+\.(png|jpg|jpeg|gif|svg|webp|tif|tiff|bmp|ico)(\?[^"'\'']*)?["'\'']' rawpedia_book/book.html \
              | grep -v 'file://' \
              | head -80 || true
          fi
        
          echo
          echo "---- missing-images.txt ----"
          cat rawpedia_book/missing-images.txt 2>/dev/null || true
        
          exit 1
        fi

      - name: Verify PDF content was generated
        run: |
          set -euo pipefail

          test -f rawpedia_book/book.html
          test -f rawtherapee_manual.pdf

          echo "---- Selected article count from generated HTML ----"
          ARTICLE_COUNT="$(grep -c '<section class="article"' rawpedia_book/book.html || true)"
          echo "ARTICLE_COUNT=$ARTICLE_COUNT"

          if [[ "$ARTICLE_COUNT" -lt 1 ]]; then
            echo "❌ Manual HTML contains no article sections."
            echo "---- Generated reports ----"
            ls -la rawpedia_book || true
            echo "---- Pages all ----"
            head -80 rawpedia_book/pages-all.txt 2>/dev/null || true
            echo "---- Skip reasons ----"
            head -220 rawpedia_book/skip-reasons.txt 2>/dev/null || true
            exit 1
          fi

      - name: Upload PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rawtherapee-manual-pdf
          path: |
            rawtherapee_manual.pdf
          if-no-files-found: warn

      - name: Upload build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rawpedia-book-reports
          path: |
            rawpedia_book/book.html
            rawpedia_book/*.txt
            rawpedia_book/*.svg
            rawpedia_book/*.png
          if-no-files-found: warn
